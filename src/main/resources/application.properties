spring.application.name=${SPRING_APPLICATION_NAME:jwks-service}

# Keep stdout machine-readable; Logback supplies service metadata.
spring.main.banner-mode=off
logging.include-application-name=false
# APP_LOG_DIR, APP_NAME and LOG_LEVEL are consumed directly by logback-spring.xml.
# Application logging inherits the configured root level unless explicitly overridden.
logging.level.com.japaneselearning.jwks=${LOGGING_LEVEL_COM_JAPANESELEARNING_JWKS:${LOG_LEVEL:INFO}}

# Keep the network peer observable; forwarded headers are not trusted caller identity.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# Dockerfile supplies SERVER_ADDRESS=0.0.0.0 and SERVER_PORT=8080; Boot binds them
# directly to server.address and server.port. Outside Docker, Boot uses all interfaces / 8080.

# Keep health as the only web-exposed Actuator endpoint by default.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
# MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED binds directly to
# management.endpoint.health.probes.enabled. Leave absent for Boot's automatic
# Kubernetes detection; parent Compose explicitly sets it to true for readiness.

# Dynamic RSA list: RsaKeyProperties (@ConfigurationProperties("app.security.jwks"))
# binds APP_SECURITY_JWKS_KEYS_<n>_KID / PUBLICKEYPATH / OWNER
# directly to app.security.jwks.keys[n].kid / publicKeyPath / owner. OWNER is required (USER or LEARNING).
# No indexed placeholder defaults: preserve arbitrary list length and fail-fast validation.
